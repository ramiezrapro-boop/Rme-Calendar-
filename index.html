<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>RME Calendar</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1a2434;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:800px;margin:auto;min-height:100vh;background:white;padding:18px 12px 80px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:25px;margin:0;letter-spacing:-1px}.sub{font-size:12px;color:#788399}button,input,select,textarea{font:inherit}button{border:0;background:#edf1f8;padding:9px 13px;border-radius:12px;cursor:pointer}button.primary{background:#1769ff;color:white;font-weight:700}.nav{display:flex;align-items:center;gap:8px}.month{font-weight:800;font-size:18px;min-width:125px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;font-weight:700;color:#748096;background:#f3f5f9;padding:9px 0;border-radius:6px}.day{min-height:94px;border:1px solid #e7eaf0;border-radius:8px;padding:4px;min-width:0;cursor:pointer}.day.active{outline:2px solid #1769ff;background:#f7faff}.day.today .number{background:#1769ff;color:white;border-radius:50%}.number{display:inline-grid;place-items:center;width:24px;height:24px;font-size:12px;font-weight:700}.pill{font-size:10px;font-weight:700;padding:4px 3px;margin-top:3px;border-radius:4px;line-height:1.25;overflow-wrap:anywhere}.list{margin-top:20px}.list h2{font-size:17px}.event{display:flex;align-items:center;gap:12px;border:1px solid #e9ecf1;border-radius:12px;padding:12px;margin:8px 0}.bar{width:7px;align-self:stretch;min-height:38px;border-radius:5px}.event strong{display:block}.event small{color:#748096}.event .edit{margin-right:auto}dialog{border:0;border-radius:18px;padding:20px;width:min(95vw,440px);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0008}form{display:grid;gap:12px}label{font-size:13px;font-weight:700}input,textarea,select{width:100%;border:1px solid #d5dce8;border-radius:10px;padding:11px;background:white}textarea{resize:vertical}.actions{display:flex;gap:8px;justify-content:space-between}.hint{font-size:12px;color:#7b8594;line-height:1.5}.legend{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{font-size:11px;padding:5px 8px;border-radius:8px;font-weight:700}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}@media(max-width:420px){.app{padding:12px 5px 80px}.day{min-height:87px;padding:2px}.pill{font-size:9px;padding:3px 2px}.number{width:20px;height:20px}.weekday{font-size:12px}.month{font-size:16px;min-width:108px}h1{font-size:22px}}@media(prefers-color-scheme:dark){body{background:#151922}} 
</style></head><body><main class="app"><header><div><h1>🎹 RME Calendar</h1><div class="sub">יומן ההופעות שלי</div></div><button class="primary" id="add">＋ אירוע</button></header><div class="toolbar"><button id="export">ייצוא גיבוי</button><button id="import">ייבוא גיבוי</button><input type="file" id="file" accept="application/json" hidden><button id="today">היום</button></div><div class="nav"><button id="prev">❯</button><div id="month" class="month"></div><button id="next">❮</button></div><div id="legend" class="legend"></div><section id="calendar" class="calendar"></section><section class="list"><h2 id="selectedTitle"></h2><div id="selectedEvents"></div></section><p class="hint">גרסה ראשונית: האירועים נשמרים בדפדפן במכשיר זה. סנכרון Google דו־כיווני עדיין לא מחובר. מומלץ לייצא גיבוי מדי פעם.</p></main><dialog id="dialog"><form id="form"><h2 id="dialogTitle">אירוע חדש</h2><div><label for="name">שם האירוע / האמן</label><input id="name" required placeholder="לדוגמה: שרית חדד - הופעה"></div><div><label for="date">תאריך</label><input id="date" type="date" required></div><div><label for="time">שעה</label><input id="time" type="time" value="20:00"></div><div><label for="balance">שעת בלאנס</label><input id="balance" type="time"></div><div><label for="place">מיקום</label><input id="place" placeholder="אולם / כתובת"></div><div><label for="notes">הערות</label><textarea id="notes" rows="2"></textarea></div><div><label for="color">צבע</label><select id="color"><option value="auto">אוטומטי לפי שם</option><option value="#FF173D">אדום</option><option value="#FFE500">צהוב</option><option value="#A020F0">סגול</option><option value="#0066FF">כחול</option><option value="#00CE55">ירוק</option><option value="#FF8C00">כתום</option><option value="#FF4EB8">ורוד</option><option value="#00C8D7">טורקיז</option></select></div><div class="actions"><button type="button" id="cancel">ביטול</button><button type="button" id="delete" style="color:#c22;display:none">מחק</button><button type="submit" class="primary">שמירה</button></div></form></dialog><script>
const defs=[{name:'שרית חדד',terms:['שרית'],color:'#FF173D',fg:'#fff'},{name:'קובי פרץ',terms:['קובי'],color:'#FFE500',fg:'#151515'},{name:'מושיק עפיה',terms:['מושיק'],color:'#A020F0',fg:'#fff'},{name:'חפלות',terms:['חפלה','חפלות'],color:'#0066FF',fg:'#fff'},{name:'אבי חלפון',terms:['אבי','חלפון'],color:'#00CE55',fg:'#fff'}];const $=id=>document.getElementById(id),now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=localDate(now),editing=null;function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function read(){try{return JSON.parse(localStorage.getItem('rme-events')||'[]')}catch{return []}}let events=read();function save(){localStorage.setItem('rme-events',JSON.stringify(events));render()}function styleFor(e){if(e.color&&e.color!=='auto'){let d=defs.find(x=>x.color===e.color);return {color:e.color,fg:d?.fg||'#fff'}}let d=defs.find(x=>x.terms.some(t=>e.name.includes(t)));return {color:d?.color||'#64748b',fg:d?.fg||'#fff'}}function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let date=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),start=date.getDay();$('month').textContent=date.toLocaleDateString('he-IL',{month:'long',year:'numeric'});$('legend').innerHTML=defs.map(d=>`<span class="chip" style="background:${d.color};color:${d.fg}">${d.name}</span>`).join('');let html=['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<Math.ceil((start+days)/7)*7;i++){let day=i-start+1;if(day<1||day>days){html+='<div></div>';continue}let iso=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,list=events.filter(e=>e.date===iso).sort((a,b)=>(a.time||'').localeCompare(b.time||''));html+=`<div class="day ${iso===selected?'active':''} ${iso===localDate(now)?'today':''}" data-date="${iso}"><span class="number">${day}</span>${list.map(e=>{let c=styleFor(e);return `<div class="pill" style="background:${c.color};color:${c.fg}">${escape(e.name)}</div>`}).join('')}</div>`}$('calendar').innerHTML=html;$('calendar').querySelectorAll('.day[data-date]').forEach(el=>el.onclick=()=>{selected=el.dataset.date;render()});$('selectedTitle').textContent=`אירועים ל־${selected.split('-').reverse().join('/')}`;let dayEvents=events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('selectedEvents').innerHTML=dayEvents.length?dayEvents.map(e=>{let c=styleFor(e);return `<div class="event"><div class="bar" style="background:${c.color}"></div><div><strong>${escape(e.name)}</strong><small>${escape(e.time||'')} ${e.balance?' · בלאנס '+escape(e.balance):''} ${e.place?' · '+escape(e.place):''}</small></div><button class="edit" data-id="${escape(e.id)}">עריכה</button></div>`}).join(''):'<p class="hint">אין אירועים ביום הזה.</p>';$('selectedEvents').querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEditor(b.dataset.id))}function openEditor(id){editing=id||null;let e=events.find(e=>e.id===id)||{name:'',date:selected,time:'20:00',balance:'',place:'',notes:'',color:'auto'};for(let k of ['name','date','time','balance','place','notes','color'])$(k).value=e[k]|| (k==='color'?'auto':'');$('dialogTitle').textContent=id?'עריכת אירוע':'אירוע חדש';$('delete').style.display=id?'':'none';$('dialog').showModal()}$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();let item={id:editing||('e'+Date.now()+Math.random().toString(36).slice(2)),...Object.fromEntries(['name','date','time','balance','place','notes','color'].map(k=>[k,$(k).value]))};if(editing)events=events.map(e=>e.id===editing?item:e);else events.push(item);selected=item.date;year=Number(selected.slice(0,4));month=Number(selected.slice(5,7))-1;save();$('dialog').close()};$('delete').onclick=()=>{if(confirm('למחוק את האירוע?')){events=events.filter(e=>e.id!==editing);save();$('dialog').close()}};$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('today').onclick=()=>{year=now.getFullYear();month=now.getMonth();selected=localDate(now);render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RME-Calendar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(x=>x.id&&x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error();if(confirm('להחליף את האירועים המקומיים בקובץ הגיבוי?')){events=data;save()}}catch{alert('קובץ גיבוי לא תקין')}e.target.value=''};render();
</script></body></html>
